name: al-lms

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=Asia/Colombo"]
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
      TZ: Asia/Colombo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production-style app container: `docker compose --profile prod up -d --build app`
  app:
    profiles: [prod]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
